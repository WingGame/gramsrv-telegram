name: Build Kuark Android

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK & SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Configure Gradle Memory & ABI Filters
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx3072m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.workers.max=2" >> ~/.gradle/gradle.properties

      - name: Build arm64-v8a APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatRelease -PabiList=arm64-v8a --no-daemon --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuark-arm64-v8a
          path: TMessagesProj/build/outputs/apk/**/*.apk
          retention-days: 7
